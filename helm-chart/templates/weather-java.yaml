apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: doodle-weather-java
    app.kubernetes.io/instance: weather-java-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: helloworld
    app.kubernetes.io/managed-by: helm
  name: doodle-weather-java
  namespace: supreme-doodle
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: doodle-weather-java
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doodle-weather-java
        app.kubernetes.io/instance: weather-java-instance
    spec:
      containers:
      - name: doodle-weather-java
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SHARD
          value: {{ .Values.shard | quote }}
        - name: SERVER_PORT
          value: "5100"
        - name: OTEL_SERVICE_NAME
          value: "weather-java-otel"
        ports:
        - containerPort: 5100
          name: application
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: doodle-weather-java
  namespace: supreme-doodle
  labels:
    app.kubernetes.io/name: doodle-weather-java
spec: 
  selector:
    app.kubernetes.io/name: doodle-weather-java
  type: {{ .Values.service.type }}
  ports:
  - name: http
    appProtocol: http
    port: {{ .Values.service.port }}
    targetPort: 5100
