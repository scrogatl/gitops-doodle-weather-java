server.port=5100

spring.application.name=doodle-weather-java

# Management & Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Logging format
logging.pattern.console=%d{HH:mm:ss.SSS} - [weather-java: ${SHARD:na}] - %msg%n
